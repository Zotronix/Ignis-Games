<html lang="en">

<body>
	<script>
		window.rep = "a8df774"
		window.addEventListener("load", function() {
			fetch("https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@" + window.rep + "/index.html")
			.then(res => res.text())
			.then(text => {
				document.open();
				document.write(text.replace("<!DOCTYPE html>", "<base href='https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@" + window.rep + "/' />"));
				document.close();
			})
		})
	</script>
</body>

</html>
