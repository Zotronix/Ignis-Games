<html lang="en">

<body>
	<script src="https://cdn.jsdelivr.net/gh/Zotronix/Ignis-Games/Games/latestRep.js"></script>
	<script>
		window.addEventListener("load", function() {
			fetch("https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@" + window._webGD__ + "/index.html")
			.then(res => res.text())
			.then(text => {
				document.open();
				document.write(text.replace("<!DOCTYPE html>", "<base href='https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@" + window._webGD__ + "/' />"));
				document.close();
			})
		})
	</script>
</body>

</html>
